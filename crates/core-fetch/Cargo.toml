[package]
name = "core-fetch"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
core-parse = { path = "../core-parse" }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
encoding_rs = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# OGP カード取得で DNS 解決結果を検証するため (SSRF 対策)。reqwest 経由で既に依存している。
tokio = { version = "1", default-features = false, features = ["net", "rt"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["net", "rt", "macros"] }
